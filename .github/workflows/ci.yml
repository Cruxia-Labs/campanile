name: ci

on:
  push:
  pull_request:
  schedule:
    # weekly from-clone proof — the ONLY job that touches the network,
    # and it is acquisition (cloning upstream), never verification
    - cron: "23 6 * * 1"

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: install (must resolve ZERO third-party dependencies)
        shell: bash
        run: |
          python -m pip install -q .
          python -m pip freeze --exclude-editable | grep -vi '^campanile' \
            | grep . && { echo 'DEPENDENCY CREPT INTO THE CORE'; exit 1; } || true
      - name: install pytest (after the zero-dep assertion, deliberately)
        run: python -m pip install -q pytest
      - name: offline test suite (sockets blocked by conftest)
        run: python -m pytest tests/ -q
      - name: the flagship, as a stranger runs it
        run: python -m campanile replay xz

  verify-extra:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: install with the verify extra
        run: python -m pip install -q '.[verify]'
      - name: full suite including receipt mint -> one-file verify
        run: |
          python -m pip install -q pytest
          python -m pytest tests/ -q

  sdist-self-prove:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: build (scrubbed tar headers, verified)
        run: |
          python -m pip install -q build
          python scripts/build_release.py .
      - name: the sdist proves itself — unpack and run its own suite
        run: |
          mkdir sdist_prove && tar -xzf dist/*.tar.gz -C sdist_prove
          cd sdist_prove/*/ && python -m pip install -q pytest && python -m pytest tests/ -q

  from-clone:
    # scheduled only: proves the shipped fixture against the living upstream
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -q .
      - name: clone upstream at the pin (acquisition, labeled)
        run: |
          git clone https://github.com/tukaani-project/xz /tmp/xz
      - name: from-clone equals from-fixture
        run: python -m campanile replay xz --from-clone /tmp/xz
